name: Diagnose cPanel docroot (one-off)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Check docroot and old app path
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USER }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT || '22' }}
          APP_PATH: ${{ secrets.CPANEL_APP_PATH }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p $SSH_PORT"
          echo "== documentroot for enlazia.carlosnavarro.site =="
          $SSH "$SSH_USER@$SSH_HOST" "uapi DomainInfo domains_data" | grep -B2 'documentroot:.*enlazia\.carlosnavarro\.site' || \
          $SSH "$SSH_USER@$SSH_HOST" "uapi DomainInfo domains_data" | grep 'documentroot:'
          echo "== full domains_data (trimmed) =="
          $SSH "$SSH_USER@$SSH_HOST" "uapi DomainInfo domains_data" | grep -E 'domain:|documentroot:'
          echo "== old app path contents =="
          $SSH "$SSH_USER@$SSH_HOST" "ls -la '$APP_PATH' 2>&1 || echo 'not found'"
