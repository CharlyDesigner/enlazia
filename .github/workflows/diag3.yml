name: Diagnose SSH jail vs real filesystem (one-off)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Inspect shell and mounts
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USER }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT || '22' }}
          APP_PATH: ${{ secrets.CPANEL_APP_PATH }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p $SSH_PORT"
          echo "== shell =="
          $SSH "$SSH_USER@$SSH_HOST" "echo \$SHELL; ps -p \$\$ -o comm="
          echo "== passwd entry =="
          $SSH "$SSH_USER@$SSH_HOST" "getent passwd \$(whoami) 2>&1 || grep \$(whoami) /etc/passwd 2>&1"
          echo "== mounts (may be restricted) =="
          $SSH "$SSH_USER@$SSH_HOST" "mount 2>&1 | head -30 || cat /proc/mounts 2>&1 | head -30"
          echo "== marker file round trip =="
          $SSH "$SSH_USER@$SSH_HOST" "echo 'jail-test-$(date +%s)' > '$APP_PATH/jail-test.txt' && cat '$APP_PATH/jail-test.txt'"
          echo "== stat inode of APP_PATH and of HOME =="
          $SSH "$SSH_USER@$SSH_HOST" "stat '$APP_PATH' 2>&1"
          $SSH "$SSH_USER@$SSH_HOST" "stat \$HOME 2>&1"
          echo "== is this a jail? look for jailkit/CageFS markers =="
          $SSH "$SSH_USER@$SSH_HOST" "cat /etc/*release* 2>&1 | head -5; ls -la / 2>&1 | head -20"
