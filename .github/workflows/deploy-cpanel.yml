name: Deploy to cPanel

# Builds Enlazia and uploads the runtime files to a cPanel "Setup Node.js App".
# Required repository secrets: CPANEL_HOST, CPANEL_USER, CPANEL_SSH_KEY, CPANEL_APP_PATH
# Optional: CPANEL_SSH_PORT (default 22). See docs/deploy-cpanel.md.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Check deploy secrets
        env:
          HAS_HOST: ${{ secrets.CPANEL_HOST != '' }}
          HAS_USER: ${{ secrets.CPANEL_USER != '' }}
          HAS_KEY: ${{ secrets.CPANEL_SSH_KEY != '' }}
          HAS_PATH: ${{ secrets.CPANEL_APP_PATH != '' }}
        run: |
          missing=""
          [ "$HAS_HOST" = true ] || missing="$missing CPANEL_HOST"
          [ "$HAS_USER" = true ] || missing="$missing CPANEL_USER"
          [ "$HAS_KEY" = true ] || missing="$missing CPANEL_SSH_KEY"
          [ "$HAS_PATH" = true ] || missing="$missing CPANEL_APP_PATH"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see docs/deploy-cpanel.md)"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

      - name: Prepare release folder
        run: |
          mkdir -p release/packages/server release/apps/web
          cp app.cjs LICENSE NOTICE release/
          cp -r packages/server/dist release/packages/server/dist
          cp -r apps/web/dist release/apps/web/dist
          cp -r connectors schemas release/
          # Minimal runtime package.json: no dependencies to install on the host.
          node -e "const p=require('./package.json'); require('fs').writeFileSync('release/package.json', JSON.stringify({name:p.name,version:p.version,private:true,license:p.license,author:p.author,main:'app.cjs',scripts:{start:'node app.cjs'},engines:p.engines}, null, 2)+'\n')"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Diagnose Passenger binding (no secrets printed)
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USER }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT || '22' }}
          APP_PATH: ${{ secrets.CPANEL_APP_PATH }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p $SSH_PORT"
          echo "--- real subdomain document root (per cPanel, authoritative) ---"
          DOCROOT=$($SSH "$SSH_USER@$SSH_HOST" "uapi DomainInfo domains_data 2>&1 | grep 'documentroot:.*enlazia\.carlosnavarro\.site' | awk '{print \$2}'")
          echo "docroot=$DOCROOT"
          echo "--- Passenger config lines only (SetEnv lines are deliberately excluded) ---"
          $SSH "$SSH_USER@$SSH_HOST" "grep -h '^Passenger' '$DOCROOT/.htaccess' 2>&1 || echo '(no .htaccess or no Passenger lines there)'"
          echo "--- does app.cjs exist where Passenger expects it? ---"
          APPROOT=$($SSH "$SSH_USER@$SSH_HOST" "grep -h '^PassengerAppRoot' '$DOCROOT/.htaccess' 2>&1 | sed 's/PassengerAppRoot *\"\\(.*\\)\"/\\1/'")
          echo "approot=$APPROOT"
          $SSH "$SSH_USER@$SSH_HOST" "ls -la '$APPROOT' 2>&1 | head -20"

      - name: Upload and restart
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USER }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT || '22' }}
          APP_PATH: ${{ secrets.CPANEL_APP_PATH }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p $SSH_PORT"
          # Setup Node.js App doesn't always pre-create the application root.
          $SSH "$SSH_USER@$SSH_HOST" "mkdir -p '$APP_PATH'"
          # data/ (database, master key, custom connectors) and .env live only on the server and are never touched.
          # node_modules and logs may be created by cPanel's Node.js selector.
          rsync -az --delete --exclude 'data/' --exclude '.env' --exclude 'tmp/' --exclude '.htaccess' \
            --exclude 'node_modules' --exclude '*.log' \
            -e "$SSH" release/ "$SSH_USER@$SSH_HOST:$APP_PATH/"
          $SSH "$SSH_USER@$SSH_HOST" "mkdir -p '$APP_PATH/tmp' && touch '$APP_PATH/tmp/restart.txt'"

      - name: Verify what actually landed (no secrets)
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USER }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT || '22' }}
          APP_PATH: ${{ secrets.CPANEL_APP_PATH }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p $SSH_PORT"
          echo "--- APP_PATH listing after rsync ---"
          $SSH "$SSH_USER@$SSH_HOST" "ls -la '$APP_PATH'"
          echo "--- app.cjs content (not secret: it's just a require()) ---"
          $SSH "$SSH_USER@$SSH_HOST" "cat '$APP_PATH/app.cjs'"
          echo "--- restart.txt mtime ---"
          $SSH "$SSH_USER@$SSH_HOST" "stat -c '%y %n' '$APP_PATH/tmp/restart.txt'"
